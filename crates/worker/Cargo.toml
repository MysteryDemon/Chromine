[package]
name = "chromine-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = { version = "0.8.9", features = ["macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
bytes = "1.12.1"
chromine-shared = { version = "0.1.0", path = "../shared" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
futures-util = "0.3.34"
hex = "0.4.3"
hyper = { version = "1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "server-auto", "http1", "service"] }
libc = "0.2.191"
mime_guess = "2.0.5"
notify = "8.2.1"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream", "http2"] }
rustix = { version = "1.1.6", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
str0m = { version = "0.25.0", default-features = false, features = ["aws-lc-rs"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
subtle = "2.6.1"
time = "0.3"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
instant-acme = { version = "0.8.5", features = ["rcgen"] }
tokio-rustls = "0.26.6"
rustls = "0.23.46"
x509-parser = "0.18.1"

[dev-dependencies]
rcgen = "0.14.10"
chromine-agent = { path = "../agent" }
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-tungstenite = "0.29.0"
tower = { version = "0.5.3", features = ["util"] }
